<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="aquí nace — La plataforma que te conecta con más oportunidades financieras">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f9f8"/>
      <stop offset="1" stop-color="#e9f4f2"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="630"/></clipPath>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g clip-path="url(#clip)" fill="#0a8f80">
    <polygon points="900,-100 1160,-100 800,760 540,760" opacity="0.07"/>
    <polygon points="1120,-100 1380,-100 1020,760 760,760" opacity="0.10"/>
  </g>
  <text x="96" y="150" font-family="Fredoka, Inter, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1">
    <tspan fill="#06655a">aquí</tspan><tspan fill="#0a8f80"> nace</tspan>
  </text>
  <text x="96" y="290" font-family="Inter, Helvetica, Arial, sans-serif" font-size="66" font-weight="500" fill="#04302b" letter-spacing="-2">Tu asociación de</text>
  <text x="96" y="368" font-family="Inter, Helvetica, Arial, sans-serif" font-size="66" font-weight="500" fill="#04302b" letter-spacing="-2">créditos y ahorro</text>
  <text x="96" y="446" font-family="Inter, Helvetica, Arial, sans-serif" font-size="66" font-weight="500" fill="#04302b" letter-spacing="-2">nace aquí.</text>
  <text x="96" y="530" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#5f8781">Aportes, préstamos y ahorros de tu comunidad. Transparente y simple.</text>
  <rect x="96" y="560" width="220" height="10" rx="5" fill="#0a8f80"/>
</svg>
